# ============================================================
# sim-portail — Dokploy mode "Raw" (compose collé, sans dépôt Git)
# Image pré-construite : ghcr.io/sim-assurances/portailrh:v7
# (mettre à jour le tag vN des services "init" ET "app" à chaque version)
# ------------------------------------------------------------
# MODÈLE : aucune valeur secrète dans ce fichier. Toutes les valeurs
# sensibles se renseignent dans l'onglet Environment de Dokploy.
#
# Obligatoires (le déploiement refuse de démarrer sans elles) :
#   AUTH_SECRET          openssl rand -base64 32
#   POSTGRES_PASSWORD    openssl rand -hex 24  (hexadécimal UNIQUEMENT :
#                        la valeur est insérée telle quelle dans DATABASE_URL
#                        et dans une requête SQL de resynchronisation)
#   ALLOWED_OFFICE_IPS   IP publique du bureau (plusieurs IP ou plages CIDR
#                        séparées par des virgules)
#
# Facultatives :
#   SYSTEM_START_DATE    AAAA-MM-JJ, défaut 2026-10-01 : le calcul des
#                        absences ignore tout ce qui est antérieur
#   CRON_SECRET          openssl rand -hex 24 ; sans elle, /api/cron/absences
#                        répond 401 (aucune absence calculée automatiquement)
#   SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_FROM SMTP_SECURE
#                        sans SMTP_HOST : emails simulés (logs + notification)
#   FIREBASE_SERVICE_ACCOUNT_JSON  notifications push (JSON sur une ligne)
#   POSTGRES_USER / POSTGRES_DB    défauts = valeurs historiques ; ne JAMAIS
#                        les changer sur un volume existant
#
# Rotation du mot de passe de la base : changer POSTGRES_PASSWORD puis
# redéployer. L'entrypoint de "portailrh-db" resynchronise le mot de passe
# au démarrage, et DATABASE_URL est construite à partir de la même variable.
# ------------------------------------------------------------
# IMPORTANT — le service de base s'appelle "portailrh-db", PAS "db".
# Le service "app" est attaché à "dokploy-network", réseau PARTAGÉ par tous les
# projets Dokploy du serveur. Plusieurs autres projets (demandedachat,
# protectapp, ...) ont eux aussi un service nommé "db" : sur ce réseau partagé
# le nom "db" est ambigu et le DNS Docker peut router l'app vers le PostgreSQL
# d'une AUTRE application -> Prisma P1000 (authentification refusée) alors que
# la base de ce projet est saine. Ne jamais renommer ce service en "db".
# ============================================================

services:
  # ---------- Base de données ----------
  # Resynchronise le mot de passe et crée la base si besoin à chaque démarrage
  # (socket locale = auth trust) : robuste même sur un ancien volume.
  portailrh-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portailrh_sim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire - onglet Environment (openssl rand -hex 24)}
      POSTGRES_DB: ${POSTGRES_DB:-db_portailrh_sim}
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portailrh_sim} -d ${POSTGRES_DB:-db_portailrh_sim}"]
      interval: 5s
      timeout: 5s
      retries: 30
    entrypoint:
      - /bin/bash
      - -c
      - |
        ( until pg_isready -q -h /var/run/postgresql -d postgres 2>/dev/null; do sleep 2; done
          S="psql -h /var/run/postgresql -U $$POSTGRES_USER -d postgres -tAc"
          $$S "ALTER USER \"$$POSTGRES_USER\" WITH PASSWORD '$$POSTGRES_PASSWORD'" >/dev/null 2>&1 \
            && echo "[db-init] mot de passe de $$POSTGRES_USER resynchronise" \
            || echo "[db-init] resync mot de passe: echec"
          if [ "$$($$S "SELECT 1 FROM pg_database WHERE datname='$$POSTGRES_DB'")" != "1" ]; then
            $$S "CREATE DATABASE \"$$POSTGRES_DB\" OWNER \"$$POSTGRES_USER\"" >/dev/null 2>&1 \
              && echo "[db-init] base $$POSTGRES_DB creee" \
              || echo "[db-init] creation base $$POSTGRES_DB: echec"
          else
            echo "[db-init] base $$POSTGRES_DB deja presente"
          fi ) &
        exec docker-entrypoint.sh postgres

  # ---------- Initialisation (one-shot, s'arrête après) ----------
  # ATTENTION : `prisma db seed` fait des deleteMany() — le relancer sur une
  # base en production effacerait les vraies donnees. Il est donc protege par
  # un marqueur (/app/uploads/.seeded, sur le volume persistant "uploads") :
  # il ne s'execute qu'une seule fois, au tout premier deploiement.
  #
  # `set-admin.ts` n'est volontairement PLUS appele ici : il reecrivait le
  # mot de passe administrateur a chaque deploiement. Premiere installation
  # uniquement : le lancer une fois a la main depuis le terminal Dokploy du
  # conteneur "app" (cd backend && ADMIN_EMAIL=... ADMIN_PASSWORD=... npx tsx
  # prisma/set-admin.ts), puis changer le mot de passe depuis /profil.
  init:
    image: ghcr.io/sim-assurances/portailrh:v7
    pull_policy: always
    restart: "no"
    depends_on:
      portailrh-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portailrh_sim}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}@portailrh-db:5432/${POSTGRES_DB:-db_portailrh_sim}
    volumes:
      - uploads:/app/uploads
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        # Monorepo : le schema et prisma7.config.ts vivent dans backend/,
        # les commandes Prisma doivent donc s'executer depuis ce dossier
        # (meme raison que le "cd backend" de docker-entrypoint.sh).
        cd backend
        echo "[init] migrations..."
        npx prisma migrate deploy
        if [ -f /app/uploads/.seeded ]; then
          echo "[init] seed deja effectue precedemment -> ignore (protection des donnees)"
        else
          echo "[init] premier deploiement -> seed initial"
          npx prisma db seed
          touch /app/uploads/.seeded
        fi
        echo "[init] termine."

  # ---------- Application ----------
  app:
    image: ghcr.io/sim-assurances/portailrh:v7
    pull_policy: always
    restart: unless-stopped
    depends_on:
      portailrh-db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-portailrh_sim}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}@portailrh-db:5432/${POSTGRES_DB:-db_portailrh_sim}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET obligatoire - onglet Environment (openssl rand -base64 32)}
      AUTH_URL: https://portailrh.mysimassurances.com
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ALLOWED_OFFICE_IPS: ${ALLOWED_OFFICE_IPS:?ALLOWED_OFFICE_IPS obligatoire - IP publique du bureau (onglet Environment)}
      SYSTEM_START_DATE: ${SYSTEM_START_DATE:-2026-10-01}
      CRON_SECRET: ${CRON_SECRET:-}
      # SMTP facultatif (reinitialisation de mot de passe par email) : sans
      # SMTP_HOST, l'email est "simule" (log + notification interne, lien
      # affiche/cliquable dans /admin), jamais d'erreur bloquante.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Notifications push, cote serveur (facultatif : sans elle, les pushs
      # FCM sont desactives, les notifications internes restent actives).
      # Les cles NEXT_PUBLIC_FIREBASE_* sont, elles, figees au BUILD de
      # l'image (voir Dockerfile) : les definir ici n'aurait aucun effet.
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - uploads:/app/uploads
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.portailrh.rule=Host(`portailrh.mysimassurances.com`)
      - traefik.http.routers.portailrh.entrypoints=websecure
      - traefik.http.routers.portailrh.tls.certresolver=letsencrypt
      - traefik.http.services.portailrh.loadbalancer.server.port=3000

volumes:
  pgdata_v2:
  uploads:

networks:
  dokploy-network:
    external: true
